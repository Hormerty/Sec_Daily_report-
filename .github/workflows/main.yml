name: Veille cybersécurité
 
on:
  schedule:
    - cron: "58 5 * * *"   # 05:58 UTC chaque jour (hors heure pile : moins de retards)
  workflow_dispatch:
    inputs:
      fenetre_heures:
        description: "Fenêtre de collecte en heures (mettre 72 pour rattraper un run manqué)"
        required: false
        default: "30"
 
permissions:
  contents: read
 
concurrency:
  group: veille
  cancel-in-progress: false
 
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # pour pousser la branche « data » (état du bot)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
 
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
 
      - name: Dépendances
        run: pip install -r requirements.txt
 
      - name: "Restaurer l'état (branche data)"
        id: restaurer
        run: bash scripts/etat_restaurer.sh
 
      - name: Rapport
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TZ: Europe/Brussels
          # 30 h = 24 h + 6 h de marge pour un cron en retard ; les doublons sont filtrés par seen.json
          FENETRE_HEURES: ${{ inputs.fenetre_heures || '30' }}
          CISA_JOURS: "2"
          IGNORER_DEJA_VUS: "0"
          MAX_ARTICLES_EMAIL: "120"
        run: python veille.py
 
      # Jamais si la restauration a échoué : on n'écrase pas l'historique avec un état vide.
      - name: "Sauvegarder l'état (branche data)"
        if: always() && steps.restaurer.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/etat_sauvegarder.sh
 
      - name: Supervision (ping de succès)
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HC_URL" ]; then echo "HEALTHCHECK_URL non défini : ping ignoré."; exit 0; fi
          curl -fsS -m 10 --retry 3 "$HC_URL" >/dev/null || echo "::warning::Ping healthchecks échoué"
 
      - name: Supervision (ping d'échec)
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HC_URL" ]; then exit 0; fi
          curl -fsS -m 10 --retry 3 "$HC_URL/fail" >/dev/null || echo "::warning::Ping healthchecks échoué"
