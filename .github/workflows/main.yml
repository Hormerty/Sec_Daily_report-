name: Veille cybersécurité
on:
  schedule:
    - cron: "58 5 * * *"   # 05:58 UTC chaque jour (évite le pic de charge de l'heure pile)
  workflow_dispatch:        # lancement manuel pour tester
permissions:
  contents: write           # nécessaire pour commiter seen.json, stats.db et kev_cache.json
concurrency:
  group: veille             # jamais deux exécutions en même temps (sinon conflit sur stats.db)
  cancel-in-progress: false
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # nécessaire pour git pull --rebase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: pip install -r requirements.txt pytest
      - name: "Tests (visibles mais non bloquants, le rapport part quand même)"
        continue-on-error: true
        run: pytest -q
      - name: Rapport
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optionnel : résumé IA
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}               # optionnel : CVSS plus nombreux
          TZ: Europe/Brussels
          FENETRE_HEURES: "48"          # rapport glissant sur 2 jours
          CISA_JOURS: "2"               # entrées KEV des 2 derniers jours
          IGNORER_DEJA_VUS: "1"         # inclure les articles déjà envoyés
          MAX_ARTICLES_EMAIL: "120"     # plafond anti-troncature Gmail
        run: python veille.py
      - name: "Sauvegarder l'état (seen.json + stats.db + kev_cache.json)"
        if: always()        # le script peut sortir en 1 après avoir envoyé un rapport dégradé
        run: |
          git config user.name "noursecbot"
          git config user.email "noursecbot@users.noreply.github.com"
          for f in seen.json stats.db kev_cache.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "Aucun changement d'état."
            exit 0
          fi
          git commit -m "maj état $(date -u +%F)"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push échoué, tentative $i/3"
            sleep $((i * 5))
          done
          exit 1
