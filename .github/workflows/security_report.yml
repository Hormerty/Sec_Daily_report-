name: Rapport de Sécurité Quotidien

on:
  schedule:
    - cron: '0 8 * * *' # S'exécute tous les jours à 07:00 UTC
  workflow_dispatch: # Permet aussi de le lancer manuellement depuis l'interface GitHub

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        
      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Installation des dépendances
        run: pip install requests beautifulsoup4 deep-translator
        
      - name: Exécution du script de génération et d'envoi
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python send_security_report.py
