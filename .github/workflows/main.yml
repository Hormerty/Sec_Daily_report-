name: Veille cybersécurité
 
on:
  schedule:
    # GitHub traite les crons en « best-effort » : des déclenchements sont retardés, voire
    # abandonnés. D'où trois créneaux dans la matinée ; une garde dans veille.py (clé
    # « derniere_veille » de la branche data) empêche un second envoi le même jour.
    - cron: "58 5 * * *"   # 05:58 UTC (hors heure pile : moins de retards)
    - cron: "28 7 * * *"   # relance si le premier créneau a été abandonné
    - cron: "58 8 * * *"   # dernier filet de sécurité
  workflow_dispatch:
    inputs:
      fenetre_heures:
        description: "Fenêtre de collecte en heures (mettre 72 pour rattraper un run manqué)"
        required: false
        default: "48"
      forcer:
        description: "Renvoyer même si le rapport du jour est déjà parti (true / false)"
        required: false
        default: "false"
 
# Lecture seule par défaut : l'écriture n'est accordée qu'au job, pour pousser la branche « data ».
permissions:
  contents: read
 
# Même groupe que alerte.yml : les deux workflows touchent à l'état (branche data), jamais en parallèle.
concurrency:
  group: veille
  cancel-in-progress: false
 
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # pour pousser la branche « data » (état du bot)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 1
 
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
 
      - name: Dépendances
        run: pip install -r requirements.txt

      # Contrôles hors ligne du code : aucune dépendance, aucun réseau (stubs feedparser/requests).
      # continue-on-error : un contrôle rouge ne doit jamais empêcher l'envoi du rapport.
      - name: "Contrôles hors ligne (non bloquants)"
        continue-on-error: true
        run: python _check_veille.py

      # Les tests pytest existaient mais n'etaient lances nulle part : ils ne protegeaient rien.
      # continue-on-error : comme les controles hors ligne, un test rouge ne bloque pas l'envoi.
      - name: "Tests pytest (non bloquants)"
        continue-on-error: true
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q || echo "::warning::Tests pytest en echec"
 
      - name: "Restaurer l'état (branche data)"
        id: restaurer
        run: bash scripts/etat_restaurer.sh
 
      - name: Rapport
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          RANSOMWARE_API_KEY: ${{ secrets.RANSOMWARE_API_KEY }}
          # 5 000 requetes/heure pour l'API Advisory au lieu de 60, partagees entre runners.
          GITHUB_TOKEN: ${{ github.token }}
          TZ: Europe/Brussels
          # Rapport glissant sur 48 h
          FENETRE_HEURES: ${{ inputs.fenetre_heures || '48' }}
          CISA_JOURS: "2"
          # "1" = rapport glissant : les articles de la veille réapparaissent dans le mail du jour
          # (choix d'origine du script). "0" = seulement les nouveautés depuis le dernier mail.
          IGNORER_DEJA_VUS: "1"
          MAX_EMAIL_ARTICLES: "1000"
          MAX_EMAIL_BYTES: "0"          # 0 = pas de réduction : Gmail tronque l'affichage seul
          # Créneaux de secours : sans ce forçage, un run qui suit un envoi réussi ne fait rien.
          FORCE_VEILLE: ${{ inputs.forcer || '0' }}
        run: python veille.py
 
      # Jamais si la restauration a échoué : on n'écrase pas l'historique avec un état vide.
      - name: "Sauvegarder l'état (branche data)"
        if: always() && steps.restaurer.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/etat_sauvegarder.sh
 
      - name: Supervision (ping de succès)
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HC_URL" ]; then echo "HEALTHCHECK_URL non défini : ping ignoré."; exit 0; fi
          curl -fsS -m 10 --retry 3 "$HC_URL" >/dev/null || echo "::warning::Ping healthchecks échoué"
 
      - name: Supervision (ping d'échec)
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HC_URL" ]; then exit 0; fi
          curl -fsS -m 10 --retry 3 "$HC_URL/fail" >/dev/null || echo "::warning::Ping healthchecks échoué"
