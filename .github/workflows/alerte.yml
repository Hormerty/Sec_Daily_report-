name: Alerte cybersécurité

# E-mail immédiat, uniquement si une faille ou une attaque MAJEURE vient d'apparaître
# (score >= SEUIL_ALERTE et jamais signalée). Sinon : aucun e-mail. Le rapport quotidien
# (main.yml) reste le seul e-mail normal.
on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 h, à la minute 17 (UTC)
  workflow_dispatch:
    inputs:
      fenetre_heures:
        description: "Fenêtre de collecte en heures"
        required: false
        default: "8"

permissions:
  contents: read

# Même groupe que main.yml : un seul des deux à la fois (ils partagent l'état de la branche data).
concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  alerte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # pour pousser la branche « data » (état du bot)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: "Restaurer l'état (branche data)"
        id: restaurer
        run: bash scripts/etat_restaurer.sh

      - name: Détection d'alertes
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          RANSOMWARE_API_KEY: ${{ secrets.RANSOMWARE_API_KEY }}
          # 5 000 requetes/heure pour l'API Advisory au lieu de 60, partagees entre runners.
          GITHUB_TOKEN: ${{ github.token }}
          TZ: Europe/Brussels
          MODE_ALERTE: "1"
          ALERTE_FENETRE_HEURES: ${{ inputs.fenetre_heures || '8' }}   # 8 h = 3 h entre deux passages + marge
          CISA_JOURS: "2"
          SEUIL_ALERTE: "14"    # à ajuster selon les alertes reçues (plus haut = moins d'alertes)
          ALERTE_MAX: "5"
        run: python veille.py

      - name: "Sauvegarder l'état (branche data)"
        if: always() && steps.restaurer.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/etat_sauvegarder.sh

      # Check Healthchecks distinct de celui du rapport quotidien : deux UUID separes, sinon les
      # pings d'alerte toutes les 3 h masqueraient une panne du rapport quotidien pendant des jours.
      - name: Supervision (ping de succès)
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL_ALERTE }}
        run: |
          if [ -z "$HC_URL" ]; then echo "HEALTHCHECK_URL_ALERTE non défini : ping ignoré."; exit 0; fi
          curl -fsS -m 10 --retry 3 "$HC_URL" >/dev/null || echo "::warning::Ping healthchecks échoué"

      - name: Supervision (ping d'échec)
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL_ALERTE }}
        run: |
          if [ -z "$HC_URL" ]; then exit 0; fi
          curl -fsS -m 10 --retry 3 "$HC_URL/fail" >/dev/null || echo "::warning::Ping healthchecks échoué"
