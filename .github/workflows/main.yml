name: Veille cybersécurité

on:
  schedule:
    - cron: "58 5 * * *"   # 05:58 UTC chaque jour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt pytest

      - name: "Tests (visibles mais non bloquants)"
        continue-on-error: true
        run: pytest -q

      - name: Rapport
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TZ: Europe/Brussels
          FENETRE_HEURES: "48"
          CISA_JOURS: "2"
          IGNORER_DEJA_VUS: "1"
          MAX_ARTICLES_EMAIL: "120"
        run: python veille.py

      - name: "Sauvegarder l'état (seen.json + stats.db + kev_cache.json)"
        if: always()
        run: |
          git config user.name "noursecbot"
          git config user.email "noursecbot@users.noreply.github.com"

          for f in seen.json stats.db kev_cache.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "Aucun changement d'état."
            exit 0
          fi

          git commit -m "maj état $(date -u +%F)"

          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push échoué, tentative $i/3"
            sleep $((i * 5))
          done
          exit 1
