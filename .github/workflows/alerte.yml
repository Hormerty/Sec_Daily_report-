name: Alerte cybersécurité

# E-mail immédiat, uniquement si une faille ou une attaque MAJEURE vient d'apparaître
# (score >= SEUIL_ALERTE et jamais signalée). Sinon : aucun e-mail. Le rapport quotidien
# (main.yml) reste le seul e-mail normal.
on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 h, à la minute 17 (UTC)
  workflow_dispatch:
    inputs:
      fenetre_heures:
        description: "Fenêtre de collecte en heures"
        required: false
        default: "8"

permissions:
  contents: read

# Même groupe que main.yml : un seul des deux à la fois (ils partagent l'état de la branche data).
concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  alerte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # pour pousser la branche « data » (état du bot)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: "Restaurer l'état (branche data)"
        id: restaurer
        run: bash scripts/etat_restaurer.sh

      - name: Détection d'alertes
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TZ: Europe/Brussels
          MODE_ALERTE: "1"
          ALERTE_FENETRE_HEURES: ${{ inputs.fenetre_heures || '8' }}   # 8 h = 3 h entre deux passages + marge
          CISA_JOURS: "2"
          SEUIL_ALERTE: "14"    # à ajuster selon les alertes reçues (plus haut = moins d'alertes)
          ALERTE_MAX: "5"
        run: python veille.py

      - name: "Sauvegarder l'état (branche data)"
        if: always() && steps.restaurer.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/etat_sauvegarder.sh
