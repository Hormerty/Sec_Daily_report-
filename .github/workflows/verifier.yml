name: Vérifier
# Contrôles de code sur chaque PR et sur chaque poussée vers main.
#
# Distinct des workflows Veille et Alerte : ceux-là collectent et envoient. Celui-ci ne touche
# à rien — il installe les dépendances, lance la suite hors ligne et pytest, puis s'arrête. Il
# n'a besoin d'aucun secret, donc il peut tourner sur une PR venue d'un fork sans risque.
#
# C'est ce qui manquait pour qu'une PR Dependabot ne soit pas fusionnée à l'aveugle.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un envoi sur la même branche annule le précédent : seul le dernier état compte.
concurrency:
  group: verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Bloquants ici, contrairement aux workflows de veille : c'est tout l'intérêt de la chose.
      - name: Contrôles hors ligne
        run: python _check_veille.py

      - name: Tests pytest
        run: pytest -q
