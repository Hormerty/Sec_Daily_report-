name: Veille cybersécurité
 
on:
  schedule:
    - cron: "23 5 * * *"   # 05:23 UTC chaque jour (évite le pic de charge de l'heure pile)
  workflow_dispatch:        # lancement manuel pour tester
 
permissions:
  contents: write           # nécessaire pour enregistrer seen.json dans le dépôt
 
concurrency:
  group: veille
  cancel-in-progress: false
 
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python veille.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      - name: Enregistrer seen.json
        if: success()
        run: |
          git config user.name "noursecbot"
          git config user.email "noursecbot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "Mise à jour de seen.json" && git push)
